# The OpenTelemetry collector that runs beside every Lambda function, as a layer.
# The function's SDK sends to it on localhost; it forwards to Grafana Cloud.
# sst.config.ts copies this file into each function and sets the variables it reads.
extensions:
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_OTLP_INSTANCE_ID}
      password: ${env:GRAFANA_OTLP_TOKEN}

receivers:
  otlp:
    protocols:
      http:
        endpoint: localhost:4318

processors:
  # Adds the function's name, version, region, and memory size to every signal.
  resourcedetection:
    detectors: [lambda]
    timeout: 0.2s
    override: false
  # Lets the function return before the export to Grafana finishes, and keeps Lambda from
  # freezing the function until it has. Must stay last.
  decouple:

exporters:
  otlphttp:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana

service:
  extensions: [basicauth/grafana]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, decouple]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, decouple]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, decouple]
      exporters: [otlphttp]
