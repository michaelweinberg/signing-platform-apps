name: CI

on:
  pull_request:
  # Lets deploy.yml run exactly these checks before it deploys.
  workflow_call:

# Pull request runs only check code. They never assume the AWS deploy role.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run. Checks called from a deploy are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate types
        run: |
          pnpm generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated types are out of date. Run 'pnpm generate' and commit the result."
            git status --short
            git diff
            exit 1
          fi

      - name: Unit tests
        run: pnpm test

      - name: Start Kafka, schema registry, and DynamoDB Local
        run: docker compose up -d --wait

      - name: Integration tests
        run: pnpm test:integration

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      # Read-only against the demo registry: nothing is registered here. The key is a
      # repository secret, because pull requests cannot read the demo environment's secrets.
      - name: Schema compatibility
        env:
          SCHEMA_REGISTRY_URL: ${{ vars.SCHEMA_REGISTRY_URL }}
          SCHEMA_REGISTRY_API_KEY: ${{ secrets.SCHEMA_REGISTRY_API_KEY }}
          SCHEMA_REGISTRY_API_SECRET: ${{ secrets.SCHEMA_REGISTRY_API_SECRET }}
        run: |
          if [ -z "$SCHEMA_REGISTRY_URL" ] || [ -z "$SCHEMA_REGISTRY_API_KEY" ] || [ -z "$SCHEMA_REGISTRY_API_SECRET" ]; then
            echo "::error::Set the SCHEMA_REGISTRY_URL repository variable and the SCHEMA_REGISTRY_API_KEY and SCHEMA_REGISTRY_API_SECRET repository secrets (see the README)."
            exit 1
          fi
          pnpm schemas:check
