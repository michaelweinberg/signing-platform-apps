name: CI

on:
  pull_request:

# Pull request runs only check code. They never assume the AWS deploy role.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate types
        run: |
          pnpm generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated types are out of date. Run 'pnpm generate' and commit the result."
            git status --short
            git diff
            exit 1
          fi

      - name: Unit tests
        run: pnpm test

      - name: Start Kafka, schema registry, and DynamoDB Local
        run: docker compose up -d --wait

      - name: Integration tests
        run: pnpm test:integration

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
