name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time. A run that arrives while another is in progress waits for it;
# it is never run in parallel and never cancels the run in progress. GitHub keeps one
# waiting run per group, so if several merges pile up only the newest waits, which is
# fine: it deploys everything the skipped runs would have.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    # The schema compatibility check reads the registry with repository secrets.
    secrets: inherit

  deploy:
    name: Deploy to demo
    needs: checks
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write # to assume the AWS deploy role through OIDC
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before any code deploys, so new code never runs against a registry that lacks its
      # schemas. Fails, and stops the deploy, on a BACKWARD-incompatible schema.
      - name: Register schemas
        env:
          SCHEMA_REGISTRY_URL: ${{ vars.SCHEMA_ENVIRONMENT_URL }}
          SCHEMA_REGISTRY_API_KEY: ${{ secrets.CONFLUENT_SR_API_KEY }}
          SCHEMA_REGISTRY_API_SECRET: ${{ secrets.CONFLUENT_SR_API_SECRET }}
        run: pnpm schemas:register

      - name: Assume the AWS deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The admin key creates the topics. The key the running apps connect with is an SST
      # secret, which the pipeline never sees.
      - name: Deploy
        env:
          CONFLUENT_CLUSTER_ID: ${{ vars.CLUSTER_ID }}
          CONFLUENT_REST_ENDPOINT: ${{ vars.CLUSTER_ENDPOINT }}
          CONFLUENT_BOOTSTRAP_SERVERS: ${{ vars.CLUSTER_BOOTSTRAP_SERVERS }}
          CONFLUENT_CLUSTER_API_KEY: ${{ secrets.CONFLUENT_CLUSTER_API_KEY }}
          CONFLUENT_CLUSTER_API_SECRET: ${{ secrets.CONFLUENT_CLUSTER_API_SECRET }}
          SCHEMA_REGISTRY_URL: ${{ vars.SCHEMA_ENVIRONMENT_URL }}
        run: pnpm sst deploy --stage demo

      - name: Check the throwaway route
        env:
          CLIENT_ID: ${{ secrets.SMOKE_TEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SMOKE_TEST_CLIENT_SECRET }}
        run: |
          api="$(jq -r .apiUrl .sst/outputs.json)"
          auth="$(jq -r .authUrl .sst/outputs.json)"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$api/hello")"
          if [ "$status" != 401 ]; then
            echo "::error::Expected 401 without a token, got $status."
            exit 1
          fi

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Set the SMOKE_TEST_CLIENT_ID and SMOKE_TEST_CLIENT_SECRET secrets on the demo environment (see the README), then re-run this job."
            exit 1
          fi

          token="$(curl --fail --silent --show-error --user "$CLIENT_ID:$CLIENT_SECRET" \
            --data grant_type=client_credentials "$auth/oauth2/token" | jq -r .access_token)"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --header "Authorization: Bearer $token" "$api/hello"

      # Throwaway, like the function it invokes: writes one event to an outbox, then reads
      # the topic with the admin key until the relay has published it.
      - name: Publish an event through the outbox
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ vars.CLUSTER_BOOTSTRAP_SERVERS }}
          KAFKA_API_KEY: ${{ secrets.CONFLUENT_CLUSTER_API_KEY }}
          KAFKA_API_SECRET: ${{ secrets.CONFLUENT_CLUSTER_API_SECRET }}
          SCHEMA_REGISTRY_URL: ${{ vars.SCHEMA_ENVIRONMENT_URL }}
          SCHEMA_REGISTRY_API_KEY: ${{ secrets.CONFLUENT_SR_API_KEY }}
          SCHEMA_REGISTRY_API_SECRET: ${{ secrets.CONFLUENT_SR_API_SECRET }}
          KAFKAJS_NO_PARTITIONER_WARNING: '1'
        run: |
          published="$RUNNER_TEMP/published.json"
          aws lambda invoke --function-name "$(jq -r .publishEventFunction .sst/outputs.json)" "$published"
          # A function error still exits 0; its payload then has no agreement ID.
          if ! jq --exit-status .agreementId "$published" > /dev/null; then
            echo "::error::The publish function failed: $(cat "$published")"
            exit 1
          fi
          pnpm --filter @signing-platform/publish-event expect-event \
            "$(jq -r .topic "$published")" "$(jq -r .agreementId "$published")"
